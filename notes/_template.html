<!--
  【新しいNoteの作り方】このコメントは削除して構いません
  1. このファイルをコピーし、notes/ に半角英数字とハイフンのファイル名で保存する（例: notes/my-note.html）
     ※ ファイル名が _ で始まるものは一覧に載りません（このテンプレート自身が該当）
  2. 「記事タイトル」「記事の説明文」「ファイル名」「最終更新日」「本文」を書き換える
     ※ 一覧に表示されるタイトルは h1.page-head__title、並び順は time.note-updated の datetime（YYYY-MM-DD）
     ※ 記事内に表示される日付の文字は datetime から自動で整うので、datetime だけ書き換えればOK
  3. 画像は images/notes/ファイル名/ に置き、本文の figure ブロックで指定する
  4. GitHub に push すると、notes.html の一覧が自動で更新されます（手動で更新する場合は node scripts/build-notes.mjs）
  5. 記事を更新したときは time.note-updated の datetime を今日の日付にして push する
-->
